<!doctype html>
<html lang="en" class="no-js">
<!-- SNAPSHOT: {{REPO}} at {{SHA}} ({{BRANCH}}) on {{DATE}}. Source checkout at creation. Verify mutable code facts before reuse. Remove this comment if the checkout is unrelated to the content. -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<link rel="stylesheet" href="explain.css">
<script src="explain.js" defer></script>
<body>
<main class="k-deck">

<section class="k-claim k-slide" id="title" data-layout="title">
  <h1>{{TITLE}}</h1>
  <p class="k-lede">The answer or purpose of the deck.</p>
  <p class="k-stamp">{{REPO}} · {{DAY}}</p>
</section>

<section class="k-claim k-slide" id="first-point" data-layout="bullets">
  <h2>A takeaway heading for this slide.</h2>
  <ul>
    <li>Replace this point with the content.</li>
    <li class="k-build">A point that appears on the next key press.</li>
  </ul>
</section>

</main>
</body>
</html>
